<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- https://www.reddit.com/r/firefox/comments/nklq1o/fixing_fonts_in_firefox_using_fontconfig/ -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Segoe UI</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>Liberation Mono</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
